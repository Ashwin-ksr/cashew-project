[project]
name = "cashew-project"
version = "0.1.0"
description = "A local Python ETL project for loading monthly transaction data from Cashew into PostgreSQL, transforming it, and preparing analytics-ready data for dashboards."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "dotenv>=0.9.9",
    "ipykernel>=7.4.0",
    "pandas>=3.0.6",
    "psycopg[binary,pool]>=3.3.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cashew"]
